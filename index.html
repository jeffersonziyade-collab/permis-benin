"b":"le moteur commence à entrainer les roues","c":"le moteur tourne sans entrainer les roues"},"b"],[914,"XI","L’embrayage a pour Rôle",{"a":"d’assurer la liaison progressive entre le moteur et les roues","b":"de faire tourner le moteur plus vite","c":"d’arrêter le véhicule"},"a"],[915,"XI","Un véhicule comporte obligatoirement :",{"a":"un indicateur de vitesse","b":"un compte –tours","c":"un compteur kilométrique","d":"une jauge de carburant"},"acd"],[916,"XI","On appelle \"angle mort\" la partie de l’environnement que le conducteur :",{"a":"voit dans ses rétroviseurs","b":"voit directement au travers de son pare-brise","c":"ne peut voir au travers du pare-brise ou dans ses rétroviseurs"},"c"],[917,"XI","L’importance de \"l’angle mort\" varie selon :",{"a":"le type de véhicule","b":"le nombre de vitres latérales","c":"le réglage des rétroviseurs"},"ac"],[918,"XI","Le frein moteur intervient dès qu’on :",{"a":"lâche l’accélérateur","b":"appuie sur la pédale de frein"},"a"],[919,"XI","Le conducteur doit intervenir le plus rapidement possible si l’un de ces voyants s’allume :",{"a":"en circulation","b":"alors qu’il met le contact"},"a"],[920,"XI","Quelles sont les précautions à prendre en cas de crevaison :",{"a":"baliser les lieux,","b":"caler le véhicule,","c":"faire appel à son mécanicien."},"ab"],[921,"XI","Quel type d’extincteur faut-il recommander pour combattre un feu d’hydrocarbure ?",{"a":"extincteur à poudre","b":"extincteur à eau","c":"extincteur à mousse ou CO2","d":"extincteur polyvalent ABC"},"acd"],[922,"XI","Je fais contrôler le système de freinage :",{"a":"Si la voiture se déporte à droite ou à gauche au freinage","b":"Si la course de la pédale est trop longue","c":"Si j’entends des grincements au freinage","d":"Si mes feux de position ne s’allument pas au freinage"},"abc"],[923,"XI","Pour réduire la consommation du carburant il faut :",{"a":"avoir le système d’allumage bien régler","b":"rouler avec porte-bagages chargé","c":"rouler avec des pneumatiques bien gonflés","d":"adapter la vitesse au régime du moteur"},"acd"],[924,"XI","La pré-signalisation doit être indiquée par : a– les plaques d’immatriculation",{"b":"les feux de croisement","c":"le signal de détresse","d":"le triangle de pré-signalisation"},"cd"],[926,"XI","Quels sont les organes essentiels pour le fonctionnement d’un moteur à 4 temps ?",{"a":"La batterie – le carburateur – l’alternateur","b":"Les phares – le pneu – les feux de croisement","c":"La boite régulatrice - l’allumeur et la bougie","d":"Les feux stop – le rétroviseur – le klaxon"},"ac"],[927,"XI","Quels sont dans l’ordre les 4 temps d’un moteur à essence ?",{"a":"Admission – compression – échappement – explosion","b":"Compression – admission – explosion – échappement","c":"Admission – compression – explosion – échappement"},"c"],[928,"XI","Ce panonceau concerne les véhicules tractant une remorque d’un PTAC de :",{"a":"Plus de 250 kilogrammes","b":"240 kilogrammes","c":"80 kilogrammes"},"a"],[929,"XI","Les feux de stop s’allument lorsque :",{"a":"Je rétrograde","b":"Je freine avec la pédale","c":"J’enclenche la marche arrière","d":"Je change de direction"},"b"],[930,"XI","Les éléments qui font partie de la suspension d’un véhicule automobile sont :",{"a":"Les ressorts et la transmission","b":"Les pneus","c":"Les amortisseurs et la boite de vitesses","d":"Les ressorts et les amortisseurs"},"bd"]].map(r=>({n:r[0],c:r[1],q:r[2],o:r[3],a:r[4].split('')}));
const CH={"II": "Signalisation", "III": "Priorité, dépassement, croisement", "IV": "Arrêt, stationnement, changement de direction", "V": "Route pour automobile et autoroute", "VI": "Infractions, incivisme, secourisme", "VII": "Permis de conduire", "VIII": "Permis catégorie B", "IX": "Permis catégories C et C1", "X": "Permis catégorie D", "XI": "Mécanique, équipement, entretien, documents"};
const OTHER={IX:1,X:1};
const FREE=10,PAY_URL='https://wa.me/2290154514009?text='+encodeURIComponent('Bonjour, je veux débloquer l’application Permis (4 $).');
const HASHES=["22c44553cff40c2c7e3c17d56b0ed0d4333b362a0afc3e2a77ec2767fedc2de8","d346f37221485a4e46272730a4e6b7a1097fd5cd45749ab93277d569da676815","0a6ba356c3930614cd25af8dfe71c18ad2c569664526997afbb803388f826b06","9d80daf8a09ba5eeb7ff5cff13cc251324869df36759d9b12ee8fbb0389a6bf8","e846b8ce7a17009a5f537047dc88f900b8b85bf5f806324490c7780c8da86653","31b2b867883bfb5f7b62655059b5b5b5694ee9e0e3b2ce44fc668d682ca6d253","0c99dd3ece4af03ca888c644adf811890174a78171588ec13ac3942af8e2a197","a6fc6bf9e7f23474cc561950e811d7d57dc7e2503332462dafce199883ad7d33","74f7b9b68c60e7a24e4c3ec34dddf623c5ae540e84bdccff11fe47d3bc298726","45f93261937b033d916d88d0ac744ccc19b0588cfd2a4a313808a2bd518bddb2"];
let UNL=false;try{UNL=localStorage.getItem('permis_u')==='1'}catch(e){}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s.trim().toUpperCase()));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function wall(){
  app.innerHTML=`<div class="top"><button class="back" id="bk">← Retour</button></div><div class="q">Débloque l’application complète</div>
  <p>Accès illimité pour <b>4 $</b> (≈ 2 400 FCFA), paiement unique : toutes les questions de chaque chapitre, l’examen blanc (40 questions) et l’examen final (20 questions).</p>
  <ol><li>Paie par Mobile Money, puis envoie la preuve sur WhatsApp.</li><li>Tu reçois ton code d’accès.</li><li>Saisis-le ci-dessous.</li></ol>
  <a class="btn" href="${PAY_URL}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;margin-bottom:14px">Payer / demander mon code</a>
  <input class="code" id="code" placeholder="PN-XXXX-XXXX" autocomplete="off"><button class="btn alt" id="okc" style="width:100%">Valider le code</button><div id="msg" style="margin-top:10px"></div>`;
  $('bk').onclick=home;
  $('okc').onclick=async()=>{try{if(HASHES.includes(await sha($('code').value))){UNL=true;try{localStorage.setItem('permis_u','1')}catch(e){}home()}else $('msg').innerHTML='<div class="fb ko">Code invalide.</div>'}catch(e){$('msg').innerHTML='<div class="fb ko">Vérification impossible sur cet appareil.</div>'}}}
let P={};try{P=JSON.parse(localStorage.getItem('permis_p')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('permis_p',JSON.stringify(P))}catch(e){}};
const $=s=>document.getElementById(s);const app=$('app');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S=null;
function home(){
  const done=Object.keys(P).length,good=Object.values(P).filter(v=>v===1).length;
  const wrong=Q.filter(q=>P[q.n]===0);
  let h=`<h1>Permis de conduire – Bénin</h1><p class="sub">Manuel du candidat (édition 2011) · ${Q.length} questions de révision</p>
  <div class="stats"><div class="stat"><b>${done}</b><span>répondues</span></div><div class="stat"><b>${done?Math.round(good/done*100):0}%</b><span>réussite</span></div><div class="stat"><b>${wrong.length}</b><span>à revoir</span></div></div>
  ${UNL?'':'<div class="pay"><b>Version gratuite</b> : '+FREE+' questions par chapitre. Débloque tout (examens blanc et final inclus) pour <b>4 $</b> (≈ 2 400 FCFA).<div class="row" style="margin-top:8px"><button class="btn" id="up">Débloquer</button></div></div>'}
  <div class="row"><button class="btn" id="ex">Examen blanc (40 questions)</button><button class="btn" id="ef">Examen final (20 questions)</button><button class="btn alt" id="er" ${wrong.length?'':'disabled'}>Revoir mes erreurs</button></div>
  <h2>Réviser par chapitre</h2>`;
  for(const k in CH){const l=Q.filter(q=>q.c===k);if(!l.length)continue;const d=l.filter(q=>q.n in P).length;
    h+=`<button class="ch" data-c="${k}"><div class="t"><span>${CH[k]}${OTHER[k]?'<span class="tag">autre catégorie</span>':''}</span><small>${d}/${l.length}</small></div><div class="bar"><i style="width:${d/l.length*100}%"></i></div></button>`}
  h+=`<div class="row" style="margin-top:14px"><button class="btn alt" id="rs">Réinitialiser la progression</button></div><p class="foot">Source : Le manuel du candidat à l’examen du permis de conduire, DGTT Bénin.<br>Les questions qui renvoient à une image du manuel ne sont pas incluses.</p>`;
  app.innerHTML=h;
  if($('up'))$('up').onclick=wall;
  $('ex').onclick=()=>!UNL?wall():start(shuffle(Q.filter(q=>!OTHER[q.c])).slice(0,40),'Examen blanc',true);
  $('ef').onclick=()=>!UNL?wall():start(shuffle(Q.filter(q=>!OTHER[q.c])).slice(0,20),'Examen final',true);
  $('er').onclick=()=>start(shuffle(wrong),'Mes erreurs',false);
  $('rs').onclick=()=>{if(confirm('Effacer toute la progression ?')){P={};save();home()}};
  app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{const l=Q.filter(q=>q.c===b.dataset.c);start(UNL?l:l.slice(0,FREE),CH[b.dataset.c],false);S.locked=!UNL&&l.length>FREE});
  scrollTo(0,0)}
function start(list,title,exam){S={list,title,exam,i:0,sel:new Set(),ok:0,done:false};show()}
function show(){
  const q=S.list[S.i];if(!q)return end();
  const multi=q.a.length>1;
  let h=`<div class="top"><button class="back" id="bk">← Quitter</button><span>${esc(S.title)} · ${S.i+1}/${S.list.length}</span></div>
  <div class="bar" style="margin:-4px 0 12px"><i style="width:${S.i/S.list.length*100}%"></i></div>
  <div class="q">${esc(q.q)}${multi?'<div class="hint">Plusieurs réponses possibles</div>':''}</div>`;
  for(const k of Object.keys(q.o))h+=`<button class="opt" data-k="${k}"><span class="l">${k}</span><span>${esc(q.o[k])}</span></button>`;
  h+=`<div id="fb"></div><div class="row"><button class="btn" id="go" disabled>Valider</button></div>`;
  app.innerHTML=h;S.done=false;S.sel=new Set();
  $('bk').onclick=()=>{if(S.done||S.i===0||confirm('Quitter cette session ?'))home()};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(S.done)return;const k=b.dataset.k;
    if(!multi){S.sel.clear();app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'))}
    if(S.sel.has(k)){S.sel.delete(k);b.classList.remove('sel')}else{S.sel.add(k);b.classList.add('sel')}
    $('go').disabled=!S.sel.size});
  $('go').onclick=()=>{
    if(!S.done){S.done=true;const good=q.a.length===S.sel.size&&q.a.every(a=>S.sel.has(a));
      if(good)S.ok++;P[q.n]=good?1:0;save();
      app.querySelectorAll('.opt').forEach(b=>{const k=b.dataset.k;b.classList.remove('sel');
        if(q.a.includes(k))b.classList.add('ok');else if(S.sel.has(k))b.classList.add('ko')});
      $('fb').innerHTML=good?'<div class="fb ok">Bonne réponse ✓</div>':`<div class="fb ko">Raté. Bonne réponse : ${q.a.join(', ').toUpperCase()}</div>`;
      $('go').textContent=S.i+1<S.list.length?'Suivant':'Voir le résultat';$('fb').scrollIntoView({block:'nearest'})}
    else{S.i++;scrollTo(0,0);show()}}}
function end(){
  const n=S.list.length,p=Math.round(S.ok/n*100);
  app.innerHTML=`<div class="score"><p class="sub">${esc(S.title)}</p><div class="big">${S.ok}/${n}</div><p>${p}% de bonnes réponses</p>${S.locked?'<p class="sub">Version gratuite : débloque les autres questions du chapitre.</p><button class="btn" id="ul" style="width:100%;margin-bottom:8px">Débloquer pour 4 $</button>':''}
  <div class="row"><button class="btn" id="again">Recommencer</button><button class="btn alt" id="hm">Accueil</button></div></div>`;
  $('hm').onclick=home;if($('ul'))$('ul').onclick=wall;$('again').onclick=()=>start(S.exam?shuffle(Q.filter(q=>!OTHER[q.c])).slice(0,S.list.length):shuffle(S.list),S.title,S.exam)}
home();
</script></body></html>
